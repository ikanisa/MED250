name: MED+250 quality

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: med250-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-check:
    name: Preview-safe release gate
    # MED+250 never uses a billed GitHub account or paid Actions capacity.
    # This optional copy of the local gate is allowed only when the account and
    # the remaining Actions allocation are both confirmed as free.
    if: ${{ vars.MED250_GITHUB_FREE_ACCOUNT_CONFIRMED == 'true' && vars.MED250_GITHUB_ACTIONS_FREE_TIER_CONFIRMED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: package.json
          cache: npm
      - name: Use committed preview-safe public configuration
        run: cp .env.example .env.local
      - run: npm ci
      - run: npm run release:check
