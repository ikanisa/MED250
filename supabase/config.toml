project_id = "dawanear-marketplace"

# These administrative functions perform their own constant-time secret check.
# Disabling the gateway JWT check is required for cron/admin callers that send
# only the dedicated custom token header. The handlers still reject every
# request without the corresponding Edge Function secret.
[functions.geocode-pharmacies]
verify_jwt = false

[functions.cleanup-prescriptions]
verify_jwt = false

# These are intentionally callable before a pharmacy session exists. Each
# handler validates origin and input, rate-limits requests, and the verifier
# exchanges a one-time WhatsApp code for a permanent Supabase session.
[functions.dawanear-pharmacy-send-otp]
verify_jwt = false

[functions.dawanear-pharmacy-verify-otp]
verify_jwt = false
